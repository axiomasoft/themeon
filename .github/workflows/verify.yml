# Reusable verification SSOT for CI and release.
# Third-party actions pin the full immutable commit SHA with a version comment.
name: Verify

on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON array of Node versions to verify
        type: string
        required: false
        default: '["22", "24"]'
      run-integration:
        description: Run Playwright install and pnpm test:int
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Cache Playwright browsers
        if: inputs.run-integration
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/integration/package.json') }}

      - name: Install Playwright Chromium
        if: inputs.run-integration
        run: pnpm --filter tests-integration exec playwright install --with-deps chromium

      - name: Integration tests (fast + browser)
        if: inputs.run-integration
        run: pnpm test:int

      - name: Package contract
        run: pnpm check:pack
