# Compiler/runtime/Vite performance budgets (P2.5) — periodic / manual, not on every PR verify.
name: Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 2'

permissions: {}

jobs:
  performance:
    name: benchmark regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate self-check and build candidate
        run: node --test scripts/performance-baseline-self-check.test.mjs benchmarks/lib/measure.test.mjs && pnpm build

      - name: Build fixed reference with the same benchmark harness
        run: |
          set -euo pipefail
          reference_commit=$(node -p "JSON.parse(require('fs').readFileSync('performance-baseline.json', 'utf8')).referenceCommit")
          reference_dir="$RUNNER_TEMP/themeon-performance-reference"
          git worktree add --detach "$reference_dir" "$reference_commit"
          cp -a benchmarks/. "$reference_dir/benchmarks/"
          cd "$reference_dir"
          pnpm install --frozen-lockfile
          pnpm --filter @themeon/vite... build

      - name: Same-runner performance and correctness gate
        run: |
          node benchmarks/compare.mjs "$RUNNER_TEMP/themeon-performance-reference"
          node scripts/check-performance-baseline.mjs --reference .tmp-performance-reference.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-report
          path: |
            benchmarks/last-report.json
            .tmp-performance-reference.json
          if-no-files-found: ignore
