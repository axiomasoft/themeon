# Periodic Firefox/WebKit conformance smoke (P2.6) — not on every PR verify lane.
name: Browser

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 3'

permissions: {}

jobs:
  cross-browser:
    name: smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter tests-integration exec playwright install --with-deps ${{ matrix.browser }}

      - name: Cross-browser smoke
        env:
          THEMEON_CROSS_BROWSER: ${{ matrix.browser }}
        run: pnpm test:int:cross-browser
